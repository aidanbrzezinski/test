name: CI

on:
  workflow_dispatch:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+' # Match semantic versioning tags
    branches:
      - main
      - dev
    paths-ignore:
      - '*.md'

# NOTE: the "all_group" target and skip/variant handling below are mirrored
# in kibot_launch.sh for local runs — keep both in sync when either changes.
env:
  kibot_config: kibot_yaml/kibot_main.yaml
  # Used variant. Besides which components are shown/hidden (DNP) in the 3D
  # render and STEP export, this also determines which of ERC/DRC are
  # "applicable" yet and get run by the verify_erc_drc job below (see the
  # "Determine which checks are applicable" step, and README.md's
  # "PROJECT STAGES" section for the full picture / how to change this):
  # DRAFT: only schematic in progress -- neither ERC nor DRC run yet
  # PRELIMINARY: schematic complete, PCB layout in progress -- ERC runs, DRC does not
  # CHECKED: schematic and PCB finalized -- both ERC and DRC run
  # RELEASED: same as CHECKED, automatically selected when pushing a tag to main
  kibot_variant: DRAFT

  # Set the KiCad version to 10
  kicad_version: 10

  kibot_log: kibot_run.log

permissions:
  contents: write

jobs:
  # Runs on its own runner: generates the PCB renders (injected into the
  # .kicad_sch and README.md) and the STEP 3D export, then commits/pushes
  # them. ERC/DRC do NOT run here, so this job always completes and commits
  # its outputs regardless of the verify_erc_drc job's result.
  generate_outputs:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'Merge pull request') || github.ref_type == 'tag'"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache 3D models data
        id: models-cache
        uses: set-soft/cache@main
        with:
          path: ~/cache_3d
          key: cache_3d

      - name: Override variant to RELEASED for tag pushes
        if: ${{ github.ref_type == 'tag' }}
        run: echo "kibot_variant=RELEASED" >> $GITHUB_ENV

      - name: Generate renders, STEP export and README (KiCad ${{ env.kicad_version }})
        uses: jenseng/dynamic-uses@v1
        with:
          uses: INTI-CMNB/KiBot@v2_dk${{ env.kicad_version }}
          with: '{ "variant": "${{ env.kibot_variant }}", "config": "${{ env.kibot_config }}", "skip": "erc,drc", "additional_args": "--log ${{ env.kibot_log }} all_group", "cache3D": "YES" }'

      # Permanently embeds the top/bottom renders into the .kicad_sch cover
      # page (KiBot's own kibot_image_* mechanism only pastes into printed
      # schematic outputs, which this template doesn't generate -- see
      # kibot_resources/scripts/embed_render_images.py for details).
      # continue-on-error: a failure here (e.g. a future KiCad/KiBot render
      # naming change) shows up as a warning on this run instead of blocking
      # the renders/STEP/README from being committed below.
      - name: Embed PCB renders into schematic cover page
        continue-on-error: true
        run: python3 kibot_resources/scripts/embed_render_images.py

      - name: Pull latest changes
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "GitHub Actions"

          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "Triggered by a tag, committing changes in detached HEAD state"
            git add -A
            git commit -m "Update Outputs (release)"

            DETACHED_COMMIT=$(git rev-parse HEAD)
            echo "Checking out the main branch"
            git fetch origin main
            git checkout main

            echo "Merging detached HEAD commit into main"
            git merge --no-ff $DETACHED_COMMIT -m "Merge outputs from tag-triggered workflow" -X theirs
            echo "Pushing to main branch"
            git push origin main
          else
            echo "Triggered by a branch, using the current branch"
            git pull origin ${{ github.ref_name }} --tags --force
          fi

      - name: Discard changes to .kicad_pcb files and remove temp files
        run: |
          git checkout HEAD -- $(git ls-files "*.kicad_pcb")
          git clean -f "*.kicad_pcb"
          git clean -f "*.kicad_pro"
          git clean -f "*.kicad_dru"
          git clean -f "*.kicad_prl"

      - name: Update Outputs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: ${{ github.ref_name }}
          commit_message: Update Outputs

      - name: Store log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: log_file
          path: ${{ env.kibot_log }}

  # Runs on its own runner, in parallel with generate_outputs. Only runs
  # whichever of ERC/DRC is applicable for the current project stage (see the
  # step below) -- no outputs, nothing is committed -- and fails the pipeline
  # if a check that DID run reports errors.
  verify_erc_drc:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'Merge pull request') || github.ref_type == 'tag'"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Override variant to RELEASED for tag pushes
        if: ${{ github.ref_type == 'tag' }}
        run: echo "kibot_variant=RELEASED" >> $GITHUB_ENV

      # Project-stage gate: change this if your team wants a different
      # ERC/DRC policy per stage (also update kibot_launch.sh to match, and
      # the table in README.md's "PROJECT STAGES" section).
      - name: Determine which checks are applicable for this stage
        run: |
          case "${{ env.kibot_variant }}" in
            DRAFT)
              echo "erc_drc_skip=erc,drc" >> $GITHUB_ENV
              ;;
            PRELIMINARY)
              echo "erc_drc_skip=drc" >> $GITHUB_ENV
              ;;
            *)
              echo "erc_drc_skip=__NONE__" >> $GITHUB_ENV
              ;;
          esac

      - name: Run applicable checks (KiCad ${{ env.kicad_version }})
        uses: jenseng/dynamic-uses@v1
        with:
          uses: INTI-CMNB/KiBot@v2_dk${{ env.kicad_version }}
          with: '{ "variant": "${{ env.kibot_variant }}", "config": "${{ env.kibot_config }}", "skip": "${{ env.erc_drc_skip }}", "additional_args": "--log ${{ env.kibot_log }} __NONE__" }'

      - name: Store ERC/DRC reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: erc_drc_reports
          path: |
            Reports/
            ${{ env.kibot_log }}
